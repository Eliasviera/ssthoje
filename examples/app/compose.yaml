services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sst_hoje_dev
      POSTGRES_USER: sst_hoje_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env.local}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - sst-hoje-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sst_hoje_dev -d sst_hoje_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

volumes:
  sst-hoje-pgdata:
